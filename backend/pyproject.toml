[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qldt-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
	"sanic>=24.6,<26",
	"PyJWT>=2.10,<3",
	"bcrypt>=4,<5",
	"mysql-connector-python>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"